# deploy/nginx-streamlit.conf —— Nginx 反向代理配置
# 放到服务器的 /etc/nginx/conf.d/planner.conf（Ubuntu/Debian 系）
#
# 为什么需要 Nginx 这一层，而不是直接暴露 Streamlit 的 8501：
#   ① 浏览器访问域名默认走 80(http)/443(https) 端口，需要有个东西把
#      域名的 80/443 流量"转手"给 8501——这就是反向代理；
#   ② HTTPS 证书（小绿锁）装在 Nginx 上，Streamlit 自己不管加密；
#   ③ 以后想加"api.域名 → FastAPI 8000"只是再加一段 server 块的事。
#
# 把下面 你的域名.com 全部替换成你买的真实域名（共 1 处）。

server {
    listen 80;
    server_name wkagenthub.com www.wkagenthub.com;

    location / {
        proxy_pass http://127.0.0.1:8501;

        # ── Streamlit 的页面是 WebSocket 长连接驱动的，下面四行是让
        #    Nginx 正确"升级"成 WebSocket 的标准配置，缺了页面会一直转圈 ──
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # 把访客真实 IP 传给后端（否则日志里全是 127.0.0.1）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket 长连接别被 Nginx 默认的 60 秒空闲超时掐断
        proxy_read_timeout 86400;
    }
}

# HTTPS 部分不用手写——第 6 步运行 certbot --nginx 时，
# 它会自动在这个文件里插入 443 server 块和证书路径，并把 80 跳转 443。
