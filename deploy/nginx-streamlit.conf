# deploy/nginx-streamlit.conf —— Nginx 反向代理配置（HTTPS 版）
# 服务器路径：/etc/nginx/conf.d/planner.conf
# 2026-08-03 由 certbot 自动改造：443 块 + 证书 + 80 跳转 443

server {
    server_name wkagenthub.com www.wkagenthub.com;

    location / {
        proxy_pass http://127.0.0.1:8501;

        # ── Streamlit 的页面是 WebSocket 长连接驱动的，下面四行是让
        #    Nginx 正确"升级"成 WebSocket 的标准配置，缺了页面会一直转圈 ──
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # 把访客真实 IP 传给后端（否则日志里全是 127.0.0.1）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket 长连接别被 Nginx 默认的 60 秒空闲超时掐断
        proxy_read_timeout 86400;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wkagenthub.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wkagenthub.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# 80 端口：全部 301 跳转到 https（certbot 自动加的标准写法）
server {
    if ($host = www.wkagenthub.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = wkagenthub.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name wkagenthub.com www.wkagenthub.com;
    return 404; # managed by Certbot
}